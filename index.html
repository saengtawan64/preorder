<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบจัดเก็บและตรวจสอบมัดจำสินค้า</title>
  <meta name="description" content="ระบบภายในสำหรับพนักงาน — บันทึกและตรวจสอบข้อมูลมัดจำสินค้า" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="app">

    <!-- LOGIN GATE — shown until Firebase Auth confirms a session. -->
    <div id="auth-gate" class="auth-gate">
      <div class="auth-gate-card">
        <div class="auth-gate-icon"><i data-lucide="shield-check"></i></div>
        <h1>ระบบจัดเก็บข้อมูลมัดจำ</h1>
        <p class="text-muted">สำหรับพนักงานเท่านั้น กรุณากรอกรหัสผ่านเพื่อเข้าใช้งาน</p>

        <form id="auth-gate-form">
          <div class="form-group">
            <label for="auth-gate-password"><i data-lucide="key-round"></i> รหัสผ่าน</label>
            <div class="input-wrapper">
              <input type="password" id="auth-gate-password" placeholder="••••••••" required autofocus />
              <button type="button" id="auth-gate-toggle-vis" class="btn-icon-inside">
                <i data-lucide="eye"></i>
              </button>
            </div>
            <small id="auth-gate-error" class="error-msg hidden"></small>
          </div>

          <button type="submit" id="auth-gate-submit" class="btn btn-primary btn-block btn-lg">
            <i data-lucide="log-in"></i><span>เข้าสู่ระบบ</span>
          </button>
        </form>
      </div>
    </div>

    <!-- APP — sidebar shell -->
    <div id="app-content" class="shell hidden">

      <aside class="sidebar" id="sidebar">
        <div class="side-brand">
          <span class="side-logo"><i data-lucide="wallet"></i></span>
          <span class="side-name">DEPOSIT</span>
        </div>

        <nav class="side-nav">
          <button class="nav-item is-active" id="nav-pending" data-mode="pending">
            <i data-lucide="clock"></i><span>รอรับของ</span><em class="nav-count" id="count-pending">0</em>
          </button>
          <button class="nav-item" id="nav-received" data-mode="received">
            <i data-lucide="check-check"></i><span>รับแล้ว</span><em class="nav-count" id="count-received">0</em>
          </button>
          <button class="nav-item" id="nav-deleted" data-mode="deleted">
            <i data-lucide="trash-2"></i><span>ลบแล้ว</span><em class="nav-count" id="count-deleted">0</em>
          </button>
        </nav>

        <div class="side-foot">
          <button class="nav-item" id="export-csv-btn"><i data-lucide="download"></i><span>ส่งออก CSV</span></button>
          <button class="nav-item" id="theme-toggle-btn"><i data-lucide="sun" id="theme-icon"></i><span id="theme-label">ธีมมืด</span></button>
          <button class="nav-item nav-danger" id="logout-btn"><i data-lucide="log-out"></i><span>ออกจากระบบ</span></button>
        </div>
      </aside>

      <main class="content">
        <div class="content-top">
          <button class="btn-icon side-toggle" id="sidebar-toggle" title="เมนู"><i data-lucide="menu"></i></button>

          <div class="search-box">
            <i data-lucide="search"></i>
            <input type="text" id="search-input" placeholder="ค้นหา ชื่อ, ชื่อเล่น, เบอร์โทร, หรือสินค้า..." autocomplete="off" />
            <button id="search-clear-btn" class="btn-clear hidden">&times;</button>
          </div>

          <span id="connection-status" class="conn-pill"><i data-lucide="refresh-cw"></i><span>เชื่อมต่อ</span></span>

          <button id="add-open-btn" class="btn btn-primary">
            <i data-lucide="plus-circle"></i><span>เพิ่มมัดจำ</span>
          </button>
        </div>

        <div class="kpi-grid">
          <div class="kpi kpi-mint">
            <span class="kpi-label">ยอดมัดจำถือครอง</span>
            <span class="kpi-value mono" id="metric-total-amount">฿0</span>
          </div>
          <div class="kpi kpi-amber">
            <span class="kpi-label">รายการที่รอรับ</span>
            <span class="kpi-value mono" id="metric-total-count">0</span>
          </div>
          <div class="kpi kpi-blue">
            <span class="kpi-label">ยอดมัดจำวันนี้</span>
            <span class="kpi-value mono" id="metric-today-amount">฿0</span>
          </div>
        </div>

        <div id="grouped-dates-container"></div>

        <div id="table-empty-state" class="empty-state hidden">
          <i data-lucide="inbox"></i>
          <p>ไม่พบข้อมูลรายการมัดจำ</p>
        </div>
      </main>
    </div>

    <!-- ADD DEPOSIT — slide-over -->
    <div id="add-overlay" class="drawer-overlay hidden"></div>
    <aside id="add-panel" class="drawer" aria-hidden="true">
      <div class="drawer-header">
        <h3><i data-lucide="plus-circle"></i> เพิ่มรายการมัดจำ</h3>
        <button id="add-close-btn" class="btn-icon" title="ปิด"><i data-lucide="x"></i></button>
      </div>

      <div class="drawer-body">
        <form id="contact-form" autocomplete="off">
          <div class="form-grid">
            <div class="form-group">
              <label for="first-name"><i data-lucide="user"></i> ชื่อจริง <span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="text" id="first-name" name="firstName" placeholder="เช่น สมชาย" required />
              </div>
            </div>

            <div class="form-group">
              <label for="nickname"><i data-lucide="smile"></i> ชื่อเล่น <span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="text" id="nickname" name="nickname" placeholder="เช่น ชาย" required />
              </div>
            </div>

            <div class="form-group full-width">
              <label for="phone-number"><i data-lucide="phone"></i> เบอร์โทรลูกค้า <span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="tel" id="phone-number" name="phoneNumber" placeholder="08X-XXX-XXXX" maxlength="12" required />
              </div>
              <small class="input-hint">เบอร์โทรศัพท์ 10 หลัก</small>
            </div>

            <div class="form-group full-width">
              <label for="deposit-item"><i data-lucide="package"></i> สินค้าที่มัดจำ <span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="text" id="deposit-item" name="depositItem" placeholder="เช่น iPhone 15, กระเป๋าหนัง" required />
              </div>
            </div>

            <div class="form-group full-width">
              <label for="deposit-amount"><i data-lucide="coins"></i> ยอดมัดจำ (บาท) <span class="required">*</span></label>
              <div class="input-wrapper">
                <input type="number" id="deposit-amount" name="depositAmount" placeholder="เช่น 2000" min="1" step="any" required />
              </div>
            </div>
          </div>

          <p class="drawer-note"><i data-lucide="lock"></i> ระบบภายใน — ห้ามเผยแพร่ข้อมูลลูกค้าให้บุคคลภายนอก</p>

          <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg">
            <i data-lucide="save"></i><span>บันทึกรายการมัดจำ</span>
          </button>
        </form>
      </div>
    </aside>

    <div id="toast-container" class="toast-container"></div>
  </div>
</body>
</html>
